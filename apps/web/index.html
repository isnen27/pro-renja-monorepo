<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKSI - Modul Perencanaan dan Penganggaran</title>
    <meta name="description" content="Sistem Informasi Perencanaan dan Penganggaran Pemerintah Daerah" />
    <meta property="og:title" content="AKSI - Modul Perencanaan dan Penganggaran" />
    <meta property="og:description" content="Sistem Informasi Perencanaan dan Penganggaran Pemerintah Daerah" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aksi-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          var html = document.documentElement;
          html.classList.remove('light', 'dark');
          html.classList.add(theme);
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
